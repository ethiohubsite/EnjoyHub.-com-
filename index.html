<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EthioHub - Entertainment</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
header{padding:20px 12px;text-align:center;background:#151515;border-bottom:1px solid #333}
header h1{margin:0;color:#ff3155;font-size:32px}
header p{color:#ccc;margin:8px 0 0}
nav{display:flex;justify-content:center;gap:10px;padding:14px;flex-wrap:wrap}
nav button{background:#272727;color:white;border:0;border-radius:20px;padding:10px 18px;font-size:14px}
nav button.active{background:#ff3155}
main{max-width:650px;margin:auto;padding:10px}
.post{background:#171717;border-radius:12px;padding:14px;margin-bottom:22px}
.post h2{font-size:20px;margin:4px 0 12px}
video{width:100%;display:block;border-radius:10px;background:#000}
img{width:100%;display:block;border-radius:10px;height:auto}
.caption{color:#ddd;line-height:1.5}
.actions{display:flex;gap:10px;margin-top:12px}
.actions button{background:#292929;color:white;border:0;border-radius:8px;padding:10px 14px}
footer{text-align:center;padding:24px;color:#999}
</style>
</head>
<body>
<header>
<h1>EthioHub 🎬</h1>
<p>Your place for entertainment!</p>
</header>

<nav>
<button class="active" onclick="showPosts('all',this)">For You</button>
<button onclick="showPosts('video',this)">Videos</button>
<button onclick="showPosts('photo',this)">Photos</button>
</nav>

<main>
<div class="post" data-type="video">
<h2>🔥 Jordan 12</h2>
<video controls playsinline preload="metadata">
<source src="jordan12.mp4" type="video/mp4">
Your browser does not support this video.
</video>
<p class="caption">Watch and enjoy Jordan 12 on EthioHub! 👟🔥</p>
<div class="actions">
<button onclick="likePost(this)">❤️ Like <span>0</span></button>
<button onclick="shareSite()">↗ Share</button>
</div>
</div>

<div class="post" data-type="photo">
<h2>📸 EthioHub</h2>
<img src="card.jpg" alt="EthioHub card">
<p class="caption">Welcome to EthioHub — entertainment, photos and videos!</p>
<div class="actions">
<button onclick="likePost(this)">❤️ Like <span>0</span></button>
<button onclick="shareSite()">↗ Share</button>
</div>
</div>
</main>

<footer>
<p>© 2026 EthioHub</p>
<p>Entertainment • Videos • Photos</p>
</footer>

<script>
function likePost(button){
let count=button.querySelector('span');
count.textContent=Number(count.textContent)+1;
}
function showPosts(type,button){
document.querySelectorAll('.post').forEach(post=>{
post.style.display=(type==='all'||post.dataset.type===type)?'block':'none';
});
document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
button.classList.add('active');
}
function shareSite(){
if(navigator.share){
navigator.share({title:'EthioHub',url:location.href}).catch(()=>{});
}else{
prompt('Copy your EthioHub website link:',location.href);
}
}
</script>
</body>
</html>
