<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>መግቢያ (Login) - All-in-One</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f0f4f8;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #1e293b;
    }
    .login-card {
      background-color: #ffffff;
      width: 410px;
      max-width: 100%;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 32px 28px;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 26px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .header p {
      font-size: 14px;
      color: #64748b;
    }
    .input-group {
      margin-bottom: 16px;
    }
    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    .input-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      background-color: #f8fafc;
      transition: all 0.2s;
    }
    .input-group input:focus {
      outline: none;
      border-color: #00529B;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 82, 155, 0.1);
    }
    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #475569;
      cursor: pointer;
    }
    .forgot-link {
      color: #00529B;
      text-decoration: none;
      font-weight: 600;
    }
    .forgot-link:hover {
      text-decoration: underline;
    }
    .main-login-btn {
      width: 100%;
      background-color: #0f172a;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .main-login-btn:hover {
      background-color: #1e293b;
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 22px 0;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid #e2e8f0;
    }
    .divider span {
      padding: 0 12px;
    }
    /* የቴሌብር ዋና መግቢያ ቁልፍ */
    .telebirr-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: #00529B;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 14px;
      transition: background-color 0.2s;
    }
    .telebirr-btn:hover {
      background-color: #003e75;
    }
    /* የማህበራዊ ሚዲያ አይከኖች መደርደሪያ */
    .social-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .social-icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 46px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      background-color: #ffffff;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    .social-icon-btn:hover {
      background-color: #f8fafc;
      border-color: #cbd5e1;
      transform: translateY(-2px);
    }
    .signup-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #64748b;
    }
    .signup-footer a {
      color: #00529B;
      font-weight: 700;
      text-decoration: none;
    }
    .signup-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="header">
      <h1>እንኳን በደህና መጡ</h1>
      <p>ወደ አካውንትዎ ለመግባት መረጃዎን ያስገቡ</p>
    </div>

    <!-- መደበኛ የኢሜይል/ስልክ መግቢያ ቅጽ -->
    <form action="#" method="POST">
      <div class="input-group">
        <label for="user-id">ኢሜይል ወይም ስልክ ቁጥር (Email or Phone)</label>
        <input type="text" id="user-id" name="user-id" placeholder="example@mail.com / 0911..." required>
      </div>

      <div class="input-group">
        <label for="password">የይለፍ ቃል (Password)</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <div class="options-row">
        <label class="remember-me">
          <input type="checkbox" name="remember"> አስታውሰኝ
        </label>
        <a href="#" class="forgot-link">የይለፍ ቃል ረሱ?</a>
      </div>

      <button type="submit" class="main-login-btn">ይግቡ (Log In)</button>
    </form>

    <div class="divider"><span>ወይም በዚህ ይግቡ</span></div>

    <!-- 1. የቴሌብር መግቢያ ቁልፍ -->
    <button type="button" class="telebirr-btn" onclick="alert('በቴሌብር መግቢያ ተመርጧል!')">
      <svg width="24" height="24" viewBox="0 0 48 48" fill="none">
        <rect width="48" height="48" rx="10" fill="#FFFFFF"/>
        <path d="M14 26L21 33L35 16" stroke="#8BC441" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Login with <span style="color: #8BC441;">telebirr</span></span>
    </button>

    <!-- 2. የሌሎች መተግበሪያዎች ሎጎ አይከኖች (Google, Facebook, Instagram, TikTok) -->
    <div class="social-grid">
      <!-- Google -->
      <a href="#" class="social-icon-btn" title="Login with Google">
        <svg width="22" height="22" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96z"/>
        </svg>
      </a>

      <!-- Facebook -->
      <a href="#" class="social-icon-btn" title="Login with Facebook">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="12" fill="#1877F2"/>
          <path d="M16.671 15.469L17.203 12H13.875V9.75C13.875 8.801 14.34 7.875 15.83 7.875H17.344V4.922C17.344 4.922 15.97 4.688 14.657 4.688C11.914 4.688 10.125 6.35 10.125 9.356V12H7.078V15.469H10.125V23.854C10.736 23.95 11.362 24 12 24C12.638 24 13.264 23.95 13.875 23.854V15.469H16.671Z" fill="white"/>
        </svg>
      </a>

      <!-- Instagram -->
      <a href="#" class="social-icon-btn" title="Login with Instagram">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <defs>
            <radialGradient id="ig-all" cx="30%" cy="107%" r="150%">
              <stop offset="0%" stop-color="#fdf497" />
              <stop offset="45%" stop-color="#fd5949" />
              <stop offset="60%" stop-color="#d6249f" />
              <stop offset="90%" stop-color="#285AEB" />
            </radialGradient>
          </defs>
          <rect width="24" height="24" rx="6" fill="url(#ig-all)" />
          <rect x="4.5" y="4.5" width="15" height="15" rx="4" stroke="white" stroke-width="1.8" />
          <circle cx="12" cy="12" r="3.5" stroke="white" stroke-width="1.8" />
          <circle cx="16.8" cy="7.2" r="1" fill="white" />
        </svg>
      </a>

      <!-- TikTok -->
      <a href="#" class="social-icon-btn" title="Login with TikTok">
        <svg width="24" height="24" viewBox="0 0 48 48" fill="none">
          <rect width="48" height="48" rx="10" fill="#000000"/>
          <path d="M33.5 18.2C31.3 18.2 29.4 17.1 28.3 15.4V26.2C28.3 30.8 24.6 34.5 20 34.5C15.4 34.5 11.7 30.8 11.7 26.2C11.7 21.6 15.4 17.9 20 17.9C20.4 17.9 20.8 17.9 21.2 18V22.2C20.8 22.1 20.4 22 20 22C17.7 22 15.8 23.9 15.8 26.2C15.8 28.5 17.7 30.4 20 30.4C22.3 30.4 24.2 28.5 24.2 26.2V10H28.3C28.3 12.6 30.4 14.7 33 14.7H33.5V18.2Z" fill="#25F4EE" transform="translate(-1.2, -1.2)"/>
          <path d="M33.5 18.2C31.3 18.2 29.4 17.1 28.3 15.4V26.2C28.3 30.8 24.6 34.5 20 34.5C15.4 34.5 11.7 30.8 11.7 26.2C11.7 21.6 15.4 17.9 20 17.9C20.4 17.9 20.8 17.9 21.2 18V22.2C20.8 22.1 20.4 22 20 22C17.7 22 15.8 23.9 15.8 26.2C15.8 28.5 17.7 30.4 20 30.4C22.3 30.4 24.2 28.5 24.2 26.2V10H28.3C28.3 12.6 30.4 14.7 33 14.7H33.5V18.2Z" fill="#FE2C55" transform="translate(1.2, 1.2)"/>
          <path d="M33.5 18.2C31.3 18.2 29.4 17.1 28.3 15.4V26.2C28.3 30.8 24.6 34.5 20 34.5C15.4 34.5 11.7 30.8 11.7 26.2C11.7 21.6 15.4 17.9 20 17.9C20.4 17.9 20.8 17.9 21.2 18V22.2C20.8 22.1 20.4 22 20 22C17.7 22 15.8 23.9 15.8 26.2C15.8 28.5 17.7 30.4 20 30.4C22.3 30.4 24.2 28.5 24.2 26.2V10H28.3C28.3 12.6 30.4 14.7 33 14.7H33.5V18.2Z" fill="#FFFFFF"/>
        </svg>
      </a>
    </div>

    <div class="signup-footer">
      አካውንት የለዎትም? <a href="#">አዲስ ይክፈቱ (Sign up)</a>
    </div>
  </div>

</body>
</html>
