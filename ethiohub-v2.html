<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EthioHub New Version</title>
    <style>
        body { 
            background-color: #0b0c10; 
            color: white; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 15px; 
            box-sizing: border-box;
        }
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 5px; 
        }
        .logo { 
            color: #ff0055; 
            font-size: 24px; 
            font-weight: bold; 
        }
        
        /* አረንጓዴ የዌልካም ባነር */
        .welcome-banner {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            border-radius: 20px;
            margin: 15px auto;
            padding: 30px 20px;
            text-align: center;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 25px rgba(56, 239, 125, 0.2);
            box-sizing: border-box;
        }
        .welcome-banner h1 {
            font-size: 26px;
            font-weight: bold;
            margin: 0 0 10px 0;
            color: #ffffff;
        }
        .welcome-banner p {
            font-size: 15px;
            color: #ffffff;
            line-height: 1.6;
            margin: 0 0 20px 0;
        }
        .banner-btn {
            background-color: #ffffff;
            color: #11998e;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        /* ቪዲዮ ካርድ */
        .video-card {
            background-color: #1f2833; 
            border-radius: 20px; 
            width: 100%; 
            max-width: 450px; 
            margin: 20px auto; 
            padding: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        .video-container {
            cursor: pointer; 
            position: relative; 
            background-color: #000; 
            border-radius: 10px; 
            overflow: hidden; 
            height: 230px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        video {
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            pointer-events: none;
        }
        .play-btn {
            position: absolute; 
            background-color: rgba(255, 0, 85, 0.9); 
            width: 60px; 
            height: 60px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            font-size: 24px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- 1. ሄደር መስመር -->
    <div class="header">
        <div class="logo">EthioHub 🎬</div>
        <div style="color: #45f3ff; font-size: 14px;">Join Telegram ↗</div>
    </div>

    <!-- 2. አረንጓዴ የዌልካም ባነር -->
    <div class="welcome-banner">
        <h1>Welcome to EthioHub ✨</h1>
        <p>የኢትዮጵያን ምርጥ ቪዲዮዎች፣ ፎቶዎች እና አዝናኝ ይዘቶች በአንድ ቦታ ያግኙ!</p>
        <button class="banner-btn" onclick="alert('ወደ ቪዲዮዎች ይወስድዎታል!')">ይዘቶችን ይመልከቱ 🚀</button>
    </div>

    <!-- 3. የቪዲዮ ማጫወቻ ካርድ (ybnew.mp4) -->
    <div class="video-card">
        <h3 style="margin: 0 0 10px 0; color: #ffffff;">🔥 አዲስ ቪዲዮ (ybnew)</h3>
        
        <div class="video-container" onclick="checkVideoPayment()">
            <video preload="metadata">
                <source src="ybnew.mp4" type="video/mp4">
                ብሮውዘርዎ ይህንን ቪዲዮ አይደግፍም።
            </video>
            <div class="play-btn">▶</div>
        </div>

        <p style="margin: 10px 0 0 0; color: #ccc; font-size: 15px; font-weight: bold;">Watch and enjoy on EthioHub!</p>
    </div>

    <!-- 4. የክፍያ መቆለፊያ ጃቫስክሪፕት -->
    <script>
        function checkVideoPayment() {
            alert("ይህንን ቪዲዮ ለማየት እባክዎ በ Telebirr ወይም CBE Birr 99 ETB ይክፈሉ!");
        }
    </script>

</body>
</html>
